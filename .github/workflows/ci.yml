name: Docs Check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files and no secrets
        run: |
          test -f README.md && test -f AGENTS.md && test -f LICENSE-MIT && test -f LICENSE-APACHE
